<!DOCTYPE html>
<html>
<head>
  <title>Parakeet.js WebGPU Test</title>
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web": "/ort-local/ort.all.mjs"
    }
  }
  </script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eee; }
    #log { white-space: pre-wrap; background: #16213e; padding: 15px; border-radius: 8px; max-height: 600px; overflow-y: auto; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    .info { color: #74c0fc; }
    button { padding: 10px 20px; margin: 10px 5px 10px 0; cursor: pointer; }
    h1 { color: #74c0fc; }
  </style>
</head>
<body>
  <h1>Parakeet.js WebGPU Test (onnxruntime-web)</h1>
  <div>
    <button onclick="runTest('webgpu')">Test WebGPU Only</button>
    <button onclick="runTest('webgpu-hybrid')">Test WebGPU-Hybrid</button>
    <button onclick="runTest('wasm')">Test WASM Only</button>
    <button onclick="runTestAuto()">Auto Test (report result)</button>
  </div>
  <div id="log"></div>

  <script type="module">
    const logEl = document.getElementById('log');

    function log(msg, type = '') {
      const line = document.createElement('div');
      line.className = type;
      line.textContent = `[${new Date().toISOString().slice(11,19)}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // Expose result for Playwright to read
    window.testResult = null;

    window.runTestAuto = async function() {
      // Check WebGPU availability
      let backend = 'wasm';
      if (navigator.gpu) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            backend = 'webgpu-hybrid';
            log(`WebGPU available, using ${backend}`, 'info');
          }
        } catch (e) {
          log(`WebGPU check failed: ${e.message}`, 'error');
        }
      }
      await runTest(backend);
    };

    window.runTest = async function(backend) {
      logEl.innerHTML = '';
      log(`Starting test with backend: ${backend}`, 'info');
      window.testResult = { status: 'running', backend };

      try {
        // Check WebGPU availability
        if (backend.startsWith('webgpu')) {
          if (!navigator.gpu) {
            throw new Error('WebGPU not available in this browser!');
          }
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter) {
            throw new Error('No WebGPU adapter found!');
          }
          log(`WebGPU adapter: ${adapter.info?.device || 'unknown'}`, 'success');
        }

        // Import parakeet.js modules
        log('Importing parakeet.js modules...');
        const { getParakeetModel } = await import('./src/hub.js');
        const { ParakeetModel } = await import('./src/parakeet.js');

        log('Fetching model config from HuggingFace...');
        const modelConfig = await getParakeetModel('jarrelscy/asr1', {
          backend: backend,
        });

        log(`Model type: ${modelConfig.modelType}`, 'info');
        log(`URLs: ${Object.keys(modelConfig.urls).join(', ')}`, 'info');

        log(`Creating model with backend: ${backend}...`);
        const wasmPaths = '/ort-local/';

        const model = await ParakeetModel.fromUrls({
          ...modelConfig.urls,
          filenames: modelConfig.filenames,
          modelType: modelConfig.modelType,
          backend: backend,
          wasmPaths: wasmPaths,
          verbose: true,
        });

        log('Model loaded successfully!', 'success');

        // Test with a simple audio sample (silence/tone)
        log('Creating test audio (1 second of silence)...');
        const sampleRate = 16000;
        const duration = 1;
        const testAudio = new Float32Array(sampleRate * duration);
        // Add a tiny bit of noise to avoid NaN issues
        for (let i = 0; i < testAudio.length; i++) {
          testAudio[i] = (Math.random() - 0.5) * 0.001;
        }

        log('Running transcription...');
        const startTime = performance.now();
        const result = await model.transcribe(testAudio, sampleRate);
        const elapsed = performance.now() - startTime;

        log(`Transcription result: "${result.utterance_text}"`, 'success');
        log(`Time: ${elapsed.toFixed(0)}ms`, 'info');
        if (result.metrics) {
          log(`Metrics: ${JSON.stringify(result.metrics)}`, 'info');
        }

        log('TEST PASSED!', 'success');
        window.testResult = { status: 'passed', backend, elapsed, text: result.utterance_text };

      } catch (err) {
        log(`ERROR: ${err.message}`, 'error');
        log(`Stack: ${err.stack}`, 'error');
        window.testResult = { status: 'failed', backend, error: err.message, stack: err.stack };
      }
    };
  </script>
</body>
</html>
